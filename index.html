<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <!-- `viewport-fit=cover` lets the app paint under the notch and the
         gesture bar; env(safe-area-inset-*) then pads content back in.
         `interactive-widget` keeps the layout still when the keyboard opens. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Matches --color-bg in each theme; swapped at runtime by App.tsx. -->
    <meta name="theme-color" content="#131110" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="MX Learning — Learn English with AI. Your personal language coach." />
    <title>MX Learning</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
